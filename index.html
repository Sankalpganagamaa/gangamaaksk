<html lang="en">
<head>

<style>

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px"><div style="font-size:48px">🌾</div><p style="font-size:16px;color:#555">Loading Ganga Maa KSK...</p></div></div>
<script>
var h=React.createElement;
var useState=React.useState;
var useEffect=React.useEffect;
var useCallback=React.useCallback;

// ── Constants ─────────────────────────────────────────────────────────────
var CATS=['Seeds','Fertilizer','Pesticide','Insecticide','Herbicide','Fungicide','Bio-Pesticide','Micronutrient','Zinc','Plant Growth Regulator','Other'];
var FERT_TYPES=['Urea','DAP','Potash (MOP)','NPK','SSP','Other'];
var ZINC_TYPES=['Zinc Sulphate 21%','Zinc Sulphate 33%','Zinc EDTA','Zinc Oxide','Zinc Chelate','Other'];
var MICRO_TYPES=['Boron','Ferrous Sulphate','Manganese Sulphate','Copper Sulphate','Magnesium Sulphate','Calcium Nitrate','Molybdenum','Multi-Micronutrient Mix','Other'];
var PAY_METHODS=['Cash','UPI','Bank Transfer','Cheque','Other'];
var DEF_USERS=[{id:'a1',username:'admin',password:'admin123',role:'admin',name:'Admin'},{id:'w1',username:'worker',password:'worker123',role:'worker',name:'Worker'}];
var GST={
  'Seeds':{gst:0,cgst:0,sgst:0,hsn:'1209'},
  'Fertilizer':{gst:5,cgst:2.5,sgst:2.5,hsn:'3105'},
  'Micronutrient':{gst:5,cgst:2.5,sgst:2.5,hsn:'3105'},
  'Zinc':{gst:5,cgst:2.5,sgst:2.5,hsn:'3105'},
  'Bio-Pesticide':{gst:5,cgst:2.5,sgst:2.5,hsn:'3808'},
  'Pesticide':{gst:9,cgst:4.5,sgst:4.5,hsn:'3808'},
  'Insecticide':{gst:9,cgst:4.5,sgst:4.5,hsn:'3808'},
  'Herbicide':{gst:9,cgst:4.5,sgst:4.5,hsn:'3808'},
  'Fungicide':{gst:9,cgst:4.5,sgst:4.5,hsn:'3808'},
  'Plant Growth Regulator':{gst:9,cgst:4.5,sgst:4.5,hsn:'3808'},
  'Other':{gst:5,cgst:2.5,sgst:2.5,hsn:''}
};
function getGST(cat){return GST[cat]||GST['Other'];}
function genId(){return Math.random().toString(36).slice(2,9);}
function fmt(n){return Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function toDay(){return new Date().toISOString().slice(0,10);}
function initData(){return {products:[],distributors:[],purchases:[],farmers:[],sales:[]};}
var SK={shop:'agri_shopname',data:'agri_data',users:'agri_users',session:'agri_session',sburl:'agri_sb_url',sbkey:'agri_sb_key',det:'agri_shop_details'};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function sbReady(){return !!(lsGet(SK.sburl,'')&&lsGet(SK.sbkey,''));}
function sbH(){return{'Content-Type':'application/json','apikey':lsGet(SK.sbkey,''),'Authorization':'Bearer '+lsGet(SK.sbkey,''),'Prefer':'return=representation'};}
function sbGet(table,rowId){
  var ctrl=new AbortController();setTimeout(function(){ctrl.abort();},5000);
  return fetch(lsGet(SK.sburl,'')+'/rest/v1/'+table+'?id=eq.'+rowId,{headers:sbH(),signal:ctrl.signal})
    .then(function(r){if(!r.ok)return null;return r.json();})
    .then(function(rows){return rows&&rows.length?rows[0].payload:null;})
    .catch(function(){return null;});
}
function sbSet(table,rowId,payload){
  var ctrl=new AbortController();setTimeout(function(){ctrl.abort();},5000);
  return fetch(lsGet(SK.sburl,'')+'/rest/v1/'+table,{method:'POST',headers:Object.assign({},sbH(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:rowId,payload:payload}),signal:ctrl.signal})
    .then(function(r){return r.ok||r.status===201||r.status===200;}).catch(function(){return false;});
}
function sbTest(){
  var ctrl=new AbortController();setTimeout(function(){ctrl.abort();},6000);
  return fetch(lsGet(SK.sburl,'')+'/rest/v1/agri_data?limit=1',{headers:sbH(),signal:ctrl.signal})
    .then(function(r){return r.ok;}).catch(function(){return false;});
}
function loadLocal(){return lsGet(SK.data,initData());}
function saveData(d){lsSet(SK.data,d);if(sbReady())sbSet('agri_data',1,d);}
function loadUsersLocal(){return lsGet(SK.users,DEF_USERS);}
function saveUsers(u){lsSet(SK.users,u);if(sbReady())sbSet('agri_users',1,u);}
function sib(ps,psu){return psu==='g'?ps/1000:psu==='ml'?ps/1000:ps;}

// ── Print Bill ─────────────────────────────────────────────────────────────
function printBill(sale,farmers,products,shopName){
  var farmer=farmers.find(function(f){return f.id===sale.farmerId;})||null;
  var shopDet=lsGet(SK.det,{});
  var isPaid=(sale.paymentStatus||'paid')==='paid';
  var sc=isPaid?'#1a7a3c':'#c0392b';
  var taxMap={};
  var rowsHtml='';
  (sale.items||[]).forEach(function(item){
    var p=products.find(function(pr){return pr.id===item.productId;})||null;
    var cat=p?p.category:'Other';
    var gi=getGST(cat);
    var gr=p&&p.gstRate!=null?Number(p.gstRate):gi.gst;
    var hsn=gi.hsn||'';
    var amt=Number(item.qty)*Number(item.price);
    var taxable=gr>0?amt*100/(100+gr):amt;
    var cgstAmt=taxable*gr/2/100;
    var sgstAmt=taxable*gr/2/100;
    var key=gr+'%';
    if(!taxMap[key])taxMap[key]={rate:gr,taxable:0,cgst:0,sgst:0};
    taxMap[key].taxable+=taxable;taxMap[key].cgst+=cgstAmt;taxMap[key].sgst+=sgstAmt;
    var nm=(p?p.name:(item.productName||''))+(p&&p.subType?' ('+p.subType+')':'');
    rowsHtml+='<tr><td style="padding:5px 3px;border-bottom:0.5px solid #eee">'+nm+'</td>'
      +'<td style="padding:5px 3px;text-align:center;border-bottom:0.5px solid #eee">'+hsn+'</td>'
      +'<td style="padding:5px 3px;text-align:center;border-bottom:0.5px solid #eee">'+item.qty+' '+(item.unit||'kg')+'</td>'
      +'<td style="padding:5px 3px;text-align:right;border-bottom:0.5px solid #eee">&#8377;'+fmt(item.price)+'</td>'
      +'<td style="padding:5px 3px;text-align:center;border-bottom:0.5px solid #eee">'+gr+'%</td>'
      +'<td style="padding:5px 3px;text-align:right;border-bottom:0.5px solid #eee">&#8377;'+fmt(amt)+'</td></tr>';
  });
  var sub=(sale.items||[]).reduce(function(s,i){return s+Number(i.qty)*Number(i.price);},0);
  var discAmt=sale.discount>0?sub*sale.discount/100:0;
  var grand=sub-discAmt;
  var totalTaxable=Object.values(taxMap).reduce(function(s,t){return s+t.taxable;},0);
  var totalCGST=Object.values(taxMap).reduce(function(s,t){return s+t.cgst;},0);
  var totalSGST=Object.values(taxMap).reduce(function(s,t){return s+t.sgst;},0);
  var taxRowsHtml='';
  Object.entries(taxMap).forEach(function(entry){
    var t=entry[1];
    taxRowsHtml+='<tr><td style="padding:4px 6px;font-size:12px">'+t.rate+'% GST</td>'
      +'<td style="padding:4px 6px;font-size:12px;text-align:right">&#8377;'+fmt(t.taxable)+'</td>'
      +'<td style="padding:4px 6px;font-size:12px;text-align:right">'+t.rate/2+'%=&#8377;'+fmt(t.cgst)+'</td>'
      +'<td style="padding:4px 6px;font-size:12px;text-align:right">'+t.rate/2+'%=&#8377;'+fmt(t.sgst)+'</td></tr>';
  });
  var old=document.getElementById('__pf__');if(old)old.remove();
  var ifr=document.createElement('iframe');
  ifr.id='__pf__';ifr.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;background:#fff';
  document.body.appendChild(ifr);
  var doc=ifr.contentDocument||ifr.contentWindow.document;
  doc.open();
  doc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>GST Invoice</title>'
    +'<style>body{font-family:Arial,sans-serif;font-size:13px;margin:0;padding:0}'
    +'table{width:100%;border-collapse:collapse}th{background:#f5f5f5;padding:6px 4px;font-size:12px;border-bottom:1px solid #ccc}'
    +'.box{border:1px solid #ddd;border-radius:6px;padding:10px 14px;margin-bottom:10px}'
    +'@media print{.np{display:none!important}}</style></head><body>'
    +'<div class="np" style="background:#185FA5;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between">'
    +'<span style="font-weight:600;font-size:14px">GST Invoice Preview</span>'
    +'<div style="display:flex;gap:8px">'
    +'<button onclick="window.print()" style="background:#fff;color:#185FA5;border:none;border-radius:6px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer">Print / Save PDF</button>'
    +'<button onclick="parent.document.getElementById(\'__pf__\').remove()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer">Close</button>'
    +'</div></div><div style="padding:16px">'
    +'<div style="text-align:center;margin-bottom:12px">'
    +'<h2 style="margin:0;font-size:20px">'+shopName+'</h2>'
    +(shopDet.address?'<p style="margin:2px 0;font-size:12px;color:#555">'+shopDet.address+'</p>':'')
    +(shopDet.phone?'<p style="margin:2px 0;font-size:12px">Ph: '+shopDet.phone+'</p>':'')
    +(shopDet.gstin?'<p style="margin:2px 0;font-size:12px"><b>GSTIN: '+shopDet.gstin+'</b></p>':'')
    +'<div style="border:2px solid #333;display:inline-block;padding:3px 20px;margin-top:6px;font-weight:bold;font-size:15px">TAX INVOICE</div></div>'
    +'<div style="display:flex;gap:10px;margin-bottom:10px">'
    +'<div class="box" style="flex:1"><p style="margin:2px 0"><b>Invoice No:</b> '+(sale.billNo||sale.id.slice(0,6).toUpperCase())+'</p>'
    +'<p style="margin:2px 0"><b>Date:</b> '+sale.date+'</p>'
    +'<p style="margin:2px 0"><b>Payment:</b> '+(isPaid?(sale.paymentMethod||'Cash'):'Credit / Unpaid')+'</p></div>'
    +'<div class="box" style="flex:1"><p style="margin:0 0 4px;font-weight:bold">Bill To:</p>'
    +'<p style="margin:2px 0">'+(farmer?farmer.name:'Walk-in Customer')+'</p>'
    +(farmer&&farmer.village?'<p style="margin:2px 0">Village: '+farmer.village+'</p>':'')
    +(farmer&&farmer.phone?'<p style="margin:2px 0">Ph: '+farmer.phone+'</p>':'')
    +'</div></div>'
    +'<table style="margin-bottom:12px"><thead><tr>'
    +'<th style="text-align:left">Product</th><th>HSN</th><th>Qty</th><th style="text-align:right">Rate</th><th>GST%</th><th style="text-align:right">Amount</th>'
    +'</tr></thead><tbody>'+rowsHtml+'</tbody></table>'
    +'<div style="display:flex;gap:12px">'
    +'<div class="box" style="flex:1"><p style="margin:0 0 6px;font-weight:bold;font-size:13px">Tax Breakdown</p>'
    +'<table><thead><tr><th style="text-align:left">Rate</th><th style="text-align:right">Taxable</th><th style="text-align:right">CGST</th><th style="text-align:right">SGST</th></tr></thead>'
    +'<tbody>'+taxRowsHtml+'</tbody>'
    +'<tfoot><tr style="font-weight:bold;border-top:1px solid #ccc">'
    +'<td style="padding:4px 6px">Total</td><td style="padding:4px 6px;text-align:right">&#8377;'+fmt(totalTaxable)+'</td>'
    +'<td style="padding:4px 6px;text-align:right">&#8377;'+fmt(totalCGST)+'</td>'
    +'<td style="padding:4px 6px;text-align:right">&#8377;'+fmt(totalSGST)+'</td>'
    +'</tr></tfoot></table></div>'
    +'<div style="flex:1"><table>'
    +'<tr><td style="padding:4px 6px">Subtotal</td><td style="padding:4px 6px;text-align:right">&#8377;'+fmt(sub)+'</td></tr>'
    +(sale.discount>0?'<tr><td style="padding:4px 6px;color:#c0392b">Discount ('+sale.discount+'%)</td><td style="padding:4px 6px;text-align:right;color:#c0392b">-&#8377;'+fmt(discAmt)+'</td></tr>':'')
    +'<tr><td style="padding:4px 6px">CGST</td><td style="padding:4px 6px;text-align:right">&#8377;'+fmt(totalCGST)+'</td></tr>'
    +'<tr><td style="padding:4px 6px">SGST</td><td style="padding:4px 6px;text-align:right">&#8377;'+fmt(totalSGST)+'</td></tr>'
    +'<tr style="font-weight:bold;font-size:16px;border-top:2px solid #333"><td style="padding:6px">TOTAL</td><td style="padding:6px;text-align:right;color:#1a7a3c">&#8377;'+fmt(grand)+'</td></tr>'
    +'</table></div></div>'
    +'<div style="border-top:2px dashed #888;margin:12px 0"></div>'
    +'<div style="text-align:center;margin:12px 0">'
    +'<span style="display:inline-block;border:3px solid '+sc+';color:'+sc+';font-size:22px;font-weight:900;padding:4px 16px;border-radius:6px;transform:rotate(-12deg);letter-spacing:4px;opacity:0.85">'+(isPaid?'PAID':'UNPAID')+'</span>'
    +(!isPaid?'<p style="font-size:12px;color:#c0392b;margin-top:8px;font-weight:bold">Amount Due: &#8377;'+fmt(grand)+'</p>':'')
    +'</div>'
    +'<p style="text-align:center;font-size:11px;color:#888">Seeds 0% | Fertilizer/Zinc/Micronutrient 5% | Pesticide/Insecticide 9% GST</p>'
    +'</div></body></html>');
  doc.close();
}

// ── UI Helpers ─────────────────────────────────────────────────────────────
var IS={width:'100%',boxSizing:'border-box',padding:'8px 12px',border:'0.5px solid #ccc',borderRadius:8,fontSize:14,outline:'none',background:'#fff'};
function Badge(props){
  var m={green:{bg:'#EAF3DE',c:'#3B6D11'},blue:{bg:'#E6F1FB',c:'#185FA5'},amber:{bg:'#FAEEDA',c:'#854F0B'},purple:{bg:'#EEEDFE',c:'#3C3489'},red:{bg:'#FCEBEB',c:'#A32D2D'},teal:{bg:'#E1F5EE',c:'#0F6E56'},gray:{bg:'#F1EFE8',c:'#5F5E5A'}};
  var s=m[props.color]||m.gray;
  return h('span',{style:{background:s.bg,color:s.c,borderRadius:20,padding:'2px 10px',fontSize:12,fontWeight:500,whiteSpace:'nowrap'}},props.children);
}
function Card(props){return h('div',{style:Object.assign({background:'#fff',border:'0.5px solid #e5e5e5',borderRadius:12,padding:'16px 18px'},props.style)},props.children);}
function Btn(props){
  var b={border:'none',borderRadius:8,cursor:props.disabled?'not-allowed':'pointer',fontWeight:500,fontSize:props.small?12:14,padding:props.small?'5px 12px':'9px 18px',opacity:props.disabled?0.6:1};
  if(props.danger)return h('button',{style:Object.assign({},b,{background:'#FCEBEB',color:'#A32D2D'}),onClick:props.onClick,disabled:props.disabled},props.children);
  if(props.variant==='secondary')return h('button',{style:Object.assign({},b,{background:'#f0f0f0',color:'#333'}),onClick:props.onClick,disabled:props.disabled},props.children);
  return h('button',{style:Object.assign({},b,{background:'#185FA5',color:'#fff'}),onClick:props.onClick,disabled:props.disabled},props.children);
}
function Inp(props){
  var label=props.label;var rest=Object.assign({},props);delete rest.label;
  return h('div',{style:{marginBottom:14}},
    label&&h('label',{style:{display:'block',fontSize:13,color:'#666',marginBottom:4}},label),
    h('input',Object.assign({style:IS},rest))
  );
}
function Sel(props){
  var label=props.label;var rest=Object.assign({},props);delete rest.label;
  return h('div',{style:{marginBottom:14}},
    label&&h('label',{style:{display:'block',fontSize:13,color:'#666',marginBottom:4}},label),
    h('select',Object.assign({style:IS},rest),props.children)
  );
}
function Modal(props){
  return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:1000,display:'flex',alignItems:'flex-start',justifyContent:'center',padding:16,overflowY:'auto'}},
    h('div',{style:{background:'#fff',borderRadius:16,width:'100%',maxWidth:props.wide?700:460,boxShadow:'0 8px 40px rgba(0,0,0,0.2)',marginTop:24}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px',borderBottom:'0.5px solid #eee'}},
        h('span',{style:{fontWeight:500,fontSize:15}},props.title),
        h('button',{onClick:props.onClose,style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#888',lineHeight:1}},'×')
      ),
      h('div',{style:{padding:20,maxHeight:'80vh',overflowY:'auto'}},props.children)
    )
  );
}
function catColor(c){return c==='Seeds'?'green':c==='Fertilizer'?'amber':(c==='Pesticide'||c==='Insecticide'||c==='Herbicide'||c==='Fungicide')?'red':c==='Zinc'?'teal':c==='Micronutrient'?'purple':'blue';}

// ── GST Buttons ────────────────────────────────────────────────────────────
function GSTBtns(props){
  return h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
    [0,5,9,12,18].map(function(r){
      return h('button',{key:r,type:'button',onClick:function(){props.onChange(r);},
        style:{padding:'6px 14px',border:'1.5px solid '+(Number(props.value)===r?'#185FA5':'#ddd'),borderRadius:8,cursor:'pointer',fontWeight:Number(props.value)===r?600:400,background:Number(props.value)===r?'#E6F1FB':'#fafafa',color:Number(props.value)===r?'#185FA5':'#555',fontSize:13}},r+'%');
    })
  );
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login(props){
  var state=useState({u:'',p:'',err:''});var form=state[0];var setForm=state[1];
  var shopName=lsGet(SK.shop,'Ganga Maa KSK');
  function go(){
    var users=loadUsersLocal();
    var user=users.find(function(x){return x.username===form.u.trim()&&x.password===form.p;});
    if(!user){setForm(function(f){return Object.assign({},f,{err:'Wrong username or password'});});return;}
    lsSet(SK.session,user);props.onLogin(user);
  }
  return h('div',{style:{minHeight:'100vh',background:'linear-gradient(135deg,#0d3d6b,#185FA5 60%,#1a7a5e)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}},
    h('div',{style:{background:'#fff',borderRadius:18,width:'100%',maxWidth:360,padding:'32px 28px',boxShadow:'0 16px 60px rgba(0,0,0,0.25)'}},
      h('div',{style:{textAlign:'center',marginBottom:24}},
        h('div',{style:{fontSize:40,marginBottom:8}},'🌾'),
        h('h1',{style:{fontSize:20,fontWeight:600,margin:'0 0 3px'}},shopName),
        h('p',{style:{fontSize:13,color:'#888',margin:0}},'Agricultural Shop Manager')
      ),
      sbReady()&&h('div',{style:{background:'#EAF3DE',borderRadius:8,padding:'7px 12px',fontSize:12,color:'#3B6D11',marginBottom:14,textAlign:'center'}},'🌐 Cloud database connected'),
      h('div',{style:{marginBottom:12}},
        h('label',{style:{display:'block',fontSize:13,color:'#555',marginBottom:4}},'Username'),
        h('input',{value:form.u,onChange:function(ev){setForm(function(f){return Object.assign({},f,{u:ev.target.value,err:''});});},onKeyDown:function(ev){if(ev.key==='Enter')go();},placeholder:'Enter username',style:Object.assign({},IS,{padding:'10px 14px',border:'1.5px solid #ddd',borderRadius:10,fontSize:15})})
      ),
      h('div',{style:{marginBottom:6}},
        h('label',{style:{display:'block',fontSize:13,color:'#555',marginBottom:4}},'Password'),
        h('input',{value:form.p,onChange:function(ev){setForm(function(f){return Object.assign({},f,{p:ev.target.value,err:''});});},onKeyDown:function(ev){if(ev.key==='Enter')go();},type:'password',placeholder:'Enter password',style:Object.assign({},IS,{padding:'10px 14px',border:'1.5px solid #ddd',borderRadius:10,fontSize:15})})
      ),
      form.err&&h('p',{style:{color:'#A32D2D',fontSize:13,margin:'8px 0'}},'⚠️ '+form.err),
      h('button',{onClick:go,style:{width:'100%',padding:'12px',background:'#185FA5',color:'#fff',border:'none',borderRadius:10,fontSize:15,fontWeight:600,cursor:'pointer',marginTop:14}},'Login'),
      h('div',{style:{marginTop:16,padding:'10px 14px',background:'#f5f8ff',borderRadius:10,fontSize:12,color:'#555'}},
        h('p',{style:{margin:'0 0 3px',fontWeight:500}},'Default logins:'),
        h('p',{style:{margin:'2px 0'}},'Admin: admin / admin123'),
        h('p',{style:{margin:'2px 0'}},'Worker: worker / worker123')
      )
    )
  );
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function Dashboard(props){
  var data=props.data;
  var rev=data.sales.reduce(function(s,x){return s+(x.total||0);},0);
  var pur=data.purchases.reduce(function(s,x){return s+(x.totalAmount||0);},0);
  var tod=data.sales.filter(function(s){return s.date===toDay();}).reduce(function(a,s){return a+s.total;},0);
  var low=data.products.filter(function(p){return Number(p.stock)<=(Number(p.minStock)||5);});

function Farmers(props){
  var data=props.data;var setData=props.setData;
  var ef={id:null,name:'',phone:'',village:'',type:'Regular',discount:'0',notes:''};
  var s0=useState(false);var showF=s0[0];var setShowF=s0[1];
  var sb=useState(false);var showBulk=sb[0];var setShowBulk=sb[1];
  var sbd=useState('');var bulkDist=sbd[0];var setBulkDist=sbd[1];
  var sbdt=useState(toDay());var bulkDate=sbdt[0];var setBulkDate=sbdt[1];
  var sbpm=useState('cash');var bulkPayMode=sbpm[0];var setBulkPayMode=sbpm[1];
  var emptyRow=function(){return {name:'',category:'Pesticide',subType:'',unit:'kg',pieces:'',pieceSize:'',pieceSizeUnit:'g',buyPrice:'',sellPrice:'',gstRate:9,stock:'0',minStock:'5'};};
  var sr=useState([emptyRow()]);var bulkRows=sr[0];var setBulkRows=sr[1];
  function addBulkRow(){setBulkRows(function(prev){return [...prev,emptyRow()];});}
  function remBulkRow(i){setBulkRows(function(prev){return prev.filter(function(_,idx){return idx!==i;});});}
  function upBulkRow(i,v){setBulkRows(function(prev){return prev.map(function(r,idx){
    if(idx!==i)return r;
    var updated=Object.assign({},r,v);
    if(v.category){var gi=getGST(v.category);updated.gstRate=gi.gst;}
    return updated;
  });});}
  function saveBulk(){
    if(!bulkDist)return alert('Please select a distributor');
    var valid=bulkRows.filter(function(r){return r.name&&r.sellPrice;});
    if(!valid.length)return alert('Fill at least one product name and selling price');
    var newProds=valid.map(function(r){
      var gi=getGST(r.category);
      var gr=r.gstRate!=null?Number(r.gstRate):gi.gst;
      var pc=Number(r.pieces)||0;var ps=Number(r.pieceSize)||0;var psu=r.pieceSizeUnit||'g';
      var finalStock=Number(r.stock)||0;
      if(pc>0&&ps>0){finalStock=Math.round(pc*sib(ps,psu)*1000)/1000;}
      return Object.assign({},r,{id:genId(),gstRate:gr,stock:finalStock,pieces:pc||'',pieceSize:ps||'',pieceSizeUnit:psu});
    });
    // Create purchase record linked to distributor
    var purchItems=newProds.map(function(p){
      var gr=Number(p.gstRate)||0;
      var pc=Number(p.pieces)||0;var ps=Number(p.pieceSize)||0;var psu=p.pieceSizeUnit||'g';
      var qty=pc>0&&ps>0?Math.round(pc*sib(ps,psu)*1000)/1000:Number(p.stock)||0;
      var rate=Number(p.buyPrice)||0;
      var totalIncl=qty*rate;
      var totalBase=gr>0?totalIncl*100/(100+gr):totalIncl;
      var cgst=totalBase*gr/2/100;
      return {productId:p.id,productName:p.name,qty:qty,pieces:pc,pieceSize:ps,pieceSizeUnit:psu,
        gstRate:gr,ratePerUnit:rate,totalBase:totalBase,cgstPaid:cgst,sgstPaid:cgst,gstPaid:cgst*2,totalWithGst:totalIncl};
    });
    var totalAmt=purchItems.reduce(function(s,it){return s+it.totalWithGst;},0);
    var totalGst=purchItems.reduce(function(s,it){return s+it.gstPaid;},0);
    var paidAmt=bulkPayMode==='due'?0:totalAmt;
    var purchase={id:genId(),distributorId:bulkDist,date:bulkDate,items:purchItems,
      totalAmount:totalAmt,totalGstPaid:totalGst,paid:paidAmt,paymentMode:bulkPayMode,
      notes:'Added via bulk stock entry',stockAdded:true};
    var products=[...data.products,...newProds];
    var purchases=[...data.purchases,purchase];
    var nd=Object.assign({},data,{products:products,purchases:purchases});setData(nd);saveData(nd);
    setShowBulk(false);setBulkRows([emptyRow()]);setBulkDist('');setBulkDate(toDay());setBulkPayMode('cash');
